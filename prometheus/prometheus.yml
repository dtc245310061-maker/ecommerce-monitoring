
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: ecommerce-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: nginx-exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: mysqld-exporter
    static_configs:
      - targets: ["mysqld-exporter:9104"]